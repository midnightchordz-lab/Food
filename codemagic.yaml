workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18.17.0
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          cd frontend
          export REACT_APP_BACKEND_URL=https://tts-refactor.preview.emergentagent.com
          CI=false npm run build
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync android
      - name: Build Android APK
        script: |
          cd frontend/android
          # Use gradle directly instead of wrapper
          gradle assembleDebug --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/**/*.apk

  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18.17.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          cd frontend
          export REACT_APP_BACKEND_URL=https://tts-refactor.preview.emergentagent.com
          CI=false npm run build
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install
      - name: Set up code signing (ad-hoc)
        script: |
          cd frontend/ios/App
          # Create exportOptions for ad-hoc distribution without signing
          cat > exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST
      - name: Build iOS App
        script: |
          cd frontend/ios/App
          # Build for iOS Simulator (no signing required)
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch x86_64 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - frontend/ios/App/DerivedData/Build/Products/Debug-iphonesimulator/*.app

  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18.17.0
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          cd frontend
          export REACT_APP_BACKEND_URL=https://tts-refactor.preview.emergentagent.com
          CI=false npm run build
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync android
      - name: Build Android Release
        script: |
          cd frontend/android
          gradle assembleRelease --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/**/*.apk
      - frontend/android/app/build/outputs/**/*.aab
