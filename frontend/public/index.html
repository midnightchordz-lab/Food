        <!-- Visual Edit Scripts (iframe only) -->
        <script>
            if (window.self !== window.top) {
                var debugMonitorScript = document.createElement('script');
                debugMonitorScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugMonitorScript);

                window.tailwind = window.tailwind || {};
                tailwind.config = {
                    corePlugins: { preflight: false },
                };

                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        
        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(function(registration) {
                            console.log('MOOD FOOD SW registered:', registration.scope);
                        })
                        .catch(function(error) {
                            console.log('SW registration failed:', error);
                        });
                });
            }
        </script>
        
        <!-- Install Prompt Handler -->
        <script>
            let deferredPrompt;
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                
                // Dispatch custom event for React to handle
                window.dispatchEvent(new CustomEvent('pwaInstallAvailable', { detail: e }));
            });
            
            window.addEventListener('appinstalled', () => {
                console.log('MOOD FOOD was installed');
                deferredPrompt = null;
            });
            
            // Global function to trigger install
            window.installPWA = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('Install prompt outcome:', outcome);
                    deferredPrompt = null;
                }
            };
        </script>
    </body>
